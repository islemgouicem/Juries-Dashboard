<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eunoia Jury Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Added Playfair Display for serif headings like the logo -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght&&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'], // New serif font for logo
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              destructive: {
                DEFAULT: "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT: "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
              // Custom colors from design
              'purple-dark': '#1a0b2e',
              'purple-card': 'rgba(45, 27, 105, 0.4)',
              'gold': '#C68313', // Kept for other pages, but using specific colors in Login
              'gold-light': '#FFD700',
              // New colors based on instructions for Login.tsx
              'purple-primary': '#430870',
              'gold-design': '#F5A623',
              'gold-design-dark': '#D4941A',
              'purple-light-border': '#8B4FB3',
              'red-req': '#FC6D9F',
              'gray-muted-50': 'rgba(255, 255, 255, 0.5)',
            },
            animation: {
              "accordion-down": "accordion-down 0.2s ease-out",
              "accordion-up": "accordion-up 0.2s ease-out",
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --background: 260 50% 10%;
        --foreground: 0 0% 100%;
        --card: 260 50% 15%;
        --card-foreground: 0 0% 100%;
        --popover: 260 50% 15%;
        --popover-foreground: 0 0% 100%;
        --primary: 35 90% 50%;
        --primary-foreground: 0 0% 100%;
        --secondary: 260 30% 20%;
        --secondary-foreground: 0 0% 100%;
        --muted: 260 20% 20%;
        --muted-foreground: 260 20% 70%;
        --accent: 260 40% 30%;
        --accent-foreground: 0 0% 100%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 0 0% 98%;
        --border: 260 30% 30%;
        --input: 260 30% 30%;
        --ring: 35 90% 50%;
        --radius: 0.5rem;
      }
      body {
        /* Set new Primary Purple as per instruction */
        background-color: #430870;
        color: white;
        /* Reverted back to simple background. The gradients and stars are moved to Layout.tsx. */
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a0b2e; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4a2b75; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #C68313; 
      }
      /* Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #FFD700;
        cursor: pointer;
        margin-top: -6px; 
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }
      input[type=range]:focus::-webkit-slider-runnable-track {
        background: rgba(255, 255, 255, 0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^3.4.0",
    "@radix-ui/react-slot": "https://aistudiocdn.com/@radix-ui/react-slot@^1.2.4",
    "class-variance-authority": "https://aistudiocdn.com/class-variance-authority@^0.7.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
